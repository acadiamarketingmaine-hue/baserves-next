# Template — replace baserves-next and baserves.com. One app per site.
app = "baserves-next"
primary_region = "ewr"   # Newark: closest Fly region to Maine

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"   # client sites stay warm (ads traffic, CWV)
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
  [http_service.concurrency]
    type = "requests"
    soft_limit = 60
    hard_limit = 100
  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "8s"
    [http_service.checks.headers]
      Host = "baserves.com"
      X-Forwarded-Proto = "https"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
